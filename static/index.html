<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的设备电量</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-glow glow-a"></div>
<div class="bg-glow glow-b"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-badge">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none">
        <rect x="2" y="8" width="17" height="8" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M21.5 10.8v2.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10.2 8.9 8.4 12h2.4l-1.8 3.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div>
      <h1>我的设备电量</h1>
      <p class="brand-sub">WH-1000XM4 · Xbox Series · Hi75C Pro</p>
    </div>
  </div>
  <div class="controls">
    <label class="switch" title="自动刷新">
      <input type="checkbox" id="autoToggle" checked>
      <span class="track"><span class="thumb"></span></span>
      <span class="switch-label">自动刷新</span>
    </label>
    <div class="select-wrap">
      <select id="intervalSel" title="刷新间隔">
        <option value="15">15 秒</option>
        <option value="30">30 秒</option>
        <option value="60" selected>1 分钟</option>
        <option value="120">2 分钟</option>
        <option value="300">5 分钟</option>
        <option value="600">10 分钟</option>
      </select>
      <svg class="chev" viewBox="0 0 12 12" width="10" height="10"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </div>
    <button id="refreshBtn" class="btn-refresh" title="立即刷新">
      <svg viewBox="0 0 20 20" width="15" height="15" fill="none">
        <path d="M16.5 8.2A6.8 6.8 0 1 0 17 11.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
        <path d="M16.9 3.6v4.7h-4.7" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>刷新</span>
    </button>
  </div>
</header>

<div id="banner" class="banner hidden">
  <span class="banner-dot"></span><span id="bannerText">无法连接后台程序</span>
</div>

<main id="cards" class="cards">
  <!-- 卡片由 app.js 渲染 -->
  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>
</main>

<footer class="foot">
  <span id="footStatus">正在读取…</span>
  <span class="foot-right">数据来自系统蓝牙与 HID 接口 · 不联网</span>
</footer>

<script src="/static/app.js"></script>
</body>
</html>
